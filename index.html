<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>タイマン戦記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
<style>
/* Layout: one narrow column like a handheld RPG screen — mode select, roster / room lobby, then arena (opponent above, you below), message well, 2x2 command grid. Fills, not outlines. */
:root{
  --bg:#17202c;
  --panel:#212c3a;
  --panel-2:#2b3849;
  --well:#0f151d;
  --ink:#ede7d7;
  --muted:#8e9aab;
  --accent:#e8b84a;
  --hp:#71c98b;
  --hp-low:#e2725b;
  --mp:#6ea6e6;
  --poison:#b48be0;
  --scrim:rgba(10,14,20,.78);
  --font-pixel:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(rgba(237,231,215,.045) 1px, transparent 1px);
  background-size:14px 14px;
  color:var(--ink);font-family:var(--font-body);line-height:1.6;
}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
.screen{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--font-pixel);font-weight:400;font-size:26px;margin:0;letter-spacing:.06em}
h1 span{color:var(--accent)}
h2{font-family:var(--font-pixel);font-weight:400;font-size:19px;margin:0}
.h3{font-family:var(--font-pixel);font-weight:400;font-size:15px;margin:4px 0 0;color:var(--muted)}
#turnLabel{font-family:var(--font-pixel);color:var(--muted);font-variant-numeric:tabular-nums}
.lead{margin:0;color:var(--muted);font-size:14px}
.muted{color:var(--muted);font-size:12.5px}
.rules{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.rules li::before{content:"▸ ";color:var(--accent)}
.subhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

/* modes */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modes.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.modes,.modes.three{grid-template-columns:minmax(0,1fr)}}
.mode{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border-radius:6px;padding:16px 14px;display:flex;flex-direction:column;gap:4px;transition:background .15s, transform .15s}
.mode:hover:not([disabled]){background:var(--panel-2);transform:translateY(-2px)}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mode[disabled]{cursor:not-allowed;opacity:.5}
.mode .mt{font-family:var(--font-pixel);font-size:18px}
.mode .mt::before{content:"▶ ";color:var(--accent);font-size:13px}
.mode .md{font-size:12.5px;color:var(--muted)}

/* roster */
.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.roster{grid-template-columns:minmax(0,1fr)}}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border-radius:6px;padding:14px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;transition:background .15s, transform .15s, box-shadow .15s}
.card:hover{background:var(--panel-2);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.sel{background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--accent)}
.card[disabled]{cursor:not-allowed;opacity:.55}
.card[disabled]:hover{background:var(--panel);transform:none}
.card .bl.lock{color:var(--accent)}
.card canvas{width:72px;height:72px;image-rendering:pixelated;background:var(--well);border-radius:4px}
.card .nm{font-family:var(--font-pixel);font-size:19px;line-height:1.2}
.card .rl{font-size:12px;color:var(--accent);margin-left:6px}
.card .bl{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.stats{display:grid;grid-template-columns:auto minmax(0,1fr) 2.2em;gap:3px 8px;align-items:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats i{display:block;height:5px;background:var(--well);border-radius:2px;overflow:hidden}
.stats i b{display:block;height:100%;background:var(--accent);opacity:.8}
.stats span:nth-child(3n){text-align:right;color:var(--ink)}
.skl{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.skl b{font-weight:400;color:var(--ink)}

/* online */
.panel{background:var(--panel);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px}
.onRow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.onRow label{font-size:13px;color:var(--muted)}
input[type=text]{all:unset;box-sizing:border-box;background:var(--well);color:var(--ink);font-family:var(--font-pixel);font-size:18px;letter-spacing:.2em;padding:8px 12px;border-radius:5px;width:9em}
input[type=text]:focus-visible{outline:2px solid var(--accent)}
.note{margin:0;font-size:13px;color:var(--accent);min-height:1.2em}
.lobby{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap}
.code{font-family:var(--font-pixel);font-size:34px;letter-spacing:.3em;color:var(--accent);line-height:1.2}
.lobbyStatus{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.lobbyStatus dt{color:var(--muted)}
.lobbyStatus dd{margin:0}
.lobbyStatus .hint{grid-column:1/-1;color:var(--accent);font-family:var(--font-pixel)}

/* arena */
.arena{background:var(--panel);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px}
.fighter{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:14px;align-items:center}
.fighter.player{grid-template-columns:112px minmax(0,1fr)}
.fighter.player .stage{order:-1}
.info{display:flex;flex-direction:column;gap:5px;min-width:0}
.nameRow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name{font-family:var(--font-pixel);font-size:20px;line-height:1.1}
.tag{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.bar{display:grid;grid-template-columns:2em minmax(0,1fr) 5.6em;gap:8px;align-items:center;font-family:var(--font-pixel);font-size:13px}
.bar .lbl{color:var(--muted)}
.track{height:9px;background:var(--well);border-radius:2px;overflow:hidden}
.fill{height:100%;transition:width .45s ease, background-color .3s}
.fill.hp{background:var(--hp)}
.fill.hp.low{background:var(--hp-low)}
.fill.mp{background:var(--mp)}
.fill.xp{background:var(--accent)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:20px}
.chip{font-size:11px;padding:1px 7px;border-radius:3px;background:var(--panel-2);color:var(--ink)}
.chip.poison{background:var(--poison);color:var(--well)}
.chip.stun{background:var(--accent);color:var(--well)}
.stage{position:relative;height:112px;display:flex;align-items:flex-end;justify-content:center}
.stage canvas{width:96px;height:96px;image-rendering:pixelated;position:relative;z-index:1}
.stage .shadow{position:absolute;bottom:2px;width:70px;height:10px;border-radius:50%;background:var(--well);opacity:.7}
.stage.ko canvas{opacity:.25;transform:translateY(8px) rotate(90deg);transition:.5s}
.shake canvas{animation:shake .35s}
.lunge-r canvas{animation:lungeR .3s}
.lunge-l canvas{animation:lungeL .3s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes lungeR{50%{transform:translateX(14px)}}
@keyframes lungeL{50%{transform:translateX(-14px)}}
.float{position:absolute;top:10px;left:50%;z-index:2;font-family:var(--font-pixel);font-size:22px;color:var(--ink);text-shadow:2px 2px 0 var(--well);animation:floatUp 1s forwards;pointer-events:none;white-space:nowrap}
.float.crit{color:var(--accent);font-size:26px}
.float.heal{color:var(--hp)}
.float.miss{color:var(--muted);font-size:16px}
@keyframes floatUp{0%{transform:translate(-50%,8px);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-34px);opacity:0}}
.predBar{font-family:var(--font-pixel);font-size:12.5px;color:var(--accent);text-align:center;margin-top:-6px}
.predRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.vs{font-family:var(--font-pixel);font-size:12px;color:var(--muted);text-align:center;letter-spacing:.3em}

/* message well */
.msg{background:var(--well);border-radius:6px;padding:12px 16px;font-family:var(--font-pixel);font-size:16px;min-height:6.2em;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.msg p{margin:0}
.msg p.old{color:var(--muted);font-size:14px}

/* commands */
.cmdHead{margin:0;font-family:var(--font-pixel);font-size:14px;color:var(--accent);min-height:1.4em}
.cmds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;min-height:132px}
.cmd{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;transition:background .12s}
.cmd:hover:not([disabled]){background:var(--panel-2)}
.cmd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cmd[disabled]{cursor:not-allowed;opacity:.38}
.cmd .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cmd .cn{font-family:var(--font-pixel);font-size:16px}
.cmd .cc{font-family:var(--font-pixel);font-size:12px;color:var(--mp);white-space:nowrap}
.cmd .cd{font-size:12px;color:var(--muted);line-height:1.45}
.cmds.waiting .cmd{opacity:.38;pointer-events:none}
.waitPanel{grid-column:1/-1;background:var(--panel);border-radius:6px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.waitPanel p{margin:0;font-family:var(--font-pixel);font-size:15px}
.waitPanel small{color:var(--muted);font-size:12.5px}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* result */
.result{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.result .box{background:var(--panel);border-radius:8px;padding:28px 24px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.result h2{font-size:40px;color:var(--accent)}
.result h2.lose{color:var(--muted)}
.result h2.small{font-size:24px}
.result p{margin:0 0 8px;color:var(--muted)}
.result .rnote{margin:4px 0 0;font-size:12.5px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 14px;border-radius:5px;font-family:var(--font-pixel);font-size:15px;background:var(--panel-2);text-align:center;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--well)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.link:focus-visible{outline:2px solid var(--accent)}

/* rogue */
.rgStatus{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.rgStatus canvas{width:56px;height:56px;image-rendering:pixelated;background:var(--well);border-radius:4px}
.rgStats{display:flex;flex-wrap:wrap;gap:0 12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rgStats span{white-space:nowrap}
.rgStats b{font-weight:400;color:var(--ink)}
.mode .rec{font-size:12px;color:var(--accent)}
.floors{display:flex;flex-direction:column;gap:6px}
.floor{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:10px;align-items:center}
.floor .fl{font-family:var(--font-pixel);color:var(--muted);text-align:right}
.floor.cur .fl{color:var(--accent)}
.node{all:unset;box-sizing:border-box;background:var(--panel);border-radius:6px;padding:7px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.node .nn{font-family:var(--font-pixel);font-size:15px;display:flex;align-items:center;gap:8px}
.node .nn::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--nc)}
.node .nd{font-size:12px;color:var(--muted)}
.node.battle{--nc:var(--ink)}
.node.elite,.node.boss{--nc:var(--hp-low)}
button.node{cursor:pointer;transition:background .12s}
button.node:hover{background:var(--panel-2)}
button.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.floor.cur button.node{box-shadow:inset 0 0 0 1px var(--accent)}
.node.done{background:var(--panel-2)}
.node.future{opacity:.6}
.rgEnd{align-items:center;text-align:center}
.rgEnd h2{font-size:34px;color:var(--accent)}
.rgEnd h2.lose{color:var(--muted)}
.rgEnd .got{margin:0;font-family:var(--font-pixel);color:var(--accent)}
.shop .mode{background:var(--panel-2)}
.shop .mode:hover:not([disabled]){background:var(--well)}
.souls{font-family:var(--font-pixel);color:var(--accent);font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  .shake canvas,.lunge-r canvas,.lunge-l canvas{animation:none}
  .float{animation-duration:.01s}
  .card,.fill,.mode{transition:none}
  .dots::after{animation:none;content:"…"}
}
</style>
</head>
<body>


<main class="wrap">
  <header class="top">
    <h1>タイマン<span>戦記</span></h1>
    <span id="turnLabel"></span>
  </header>

  <section id="home" class="screen">
    <p class="lead">ターン制のキャラクター対戦です。遊び方を選んでください。</p>
    <div class="modes">
      <button class="mode" id="mode-rogue" type="button"><span class="mt">ローグライト</span><span class="md" id="rogueDesc">階層を進み、勝つたびに強くなる。最上階のボスを倒せば踏破。</span></button>
      <button class="mode" id="mode-cpu" type="button"><span class="mt">CPUと対戦</span><span class="md">ひとりで遊ぶ。相手はランダムに決まります。</span></button>
      <button class="mode" id="mode-local" type="button"><span class="mt">2人で対戦</span><span class="md">同じ端末で、交代しながら技を選びます。</span></button>
      <button class="mode" id="mode-online" type="button" disabled><span class="mt">オンライン対戦</span><span class="md" id="onlineDesc">接続を確認しています…</span></button>
    </div>
    <ul class="rules">
      <li>技は同時に選び、速さが高い方から行動</li>
      <li>毎ターン終わりにMP+8</li>
      <li>「構え」系は必ず先に動く</li>
    </ul>
  </section>

  <section id="pick" class="screen" hidden>
    <div class="subhead"><h2 id="pickTitle">キャラを選択</h2><button class="link" id="pickBack" type="button">戻る</button></div>
    <div class="roster" id="roster"></div>
  </section>

  <section id="online" class="screen" hidden>
    <div class="subhead"><h2>オンライン対戦</h2><button class="link" id="onBack" type="button">戻る</button></div>
    <div id="onIdle" class="panel">
      <div class="onRow">
        <button class="btn primary" id="onCreate" type="button">ルームを作る</button>
        <span class="muted">表示される招待URL（またはコード）をLINEなどで友達に送ってください</span>
      </div>
      <form id="onJoinForm" class="onRow">
        <label for="onCode">コードで参加</label>
        <input type="text" id="onCode" maxlength="8" autocomplete="off" spellcheck="false" placeholder="k7mq2">
        <button class="btn" type="submit">参加</button>
      </form>
    </div>
    <div id="onRole" class="panel" hidden>
      <h3 class="h3" style="margin:0">参加方法を選んでください</h3>
      <div class="onRow">
        <button class="btn primary" id="rolePlayer" type="button">対戦する</button>
        <button class="btn" id="roleSpec" type="button">観戦する</button>
      </div>
      <p class="muted" id="roleSlotNote" style="margin:0"></p>
    </div>
    <p class="note" id="onNote"></p>
    <div id="onLobby" class="screen" hidden>
      <div class="panel lobby">
        <div><span class="muted">ルームコード</span><div class="code" id="onCodeShow"></div></div>
        <div class="onRow"><button class="btn" id="onCopy" type="button">コードをコピー</button><span id="onLinkRow"><button class="btn primary" id="onCopyLink" type="button">招待URLをコピー</button></span></div>
      </div>
      <dl class="lobbyStatus" id="onStatus"></dl>
      <div class="onRow" id="specJoinRow" hidden><button class="btn primary" id="specJoin" type="button">対戦相手として参加する</button><span class="muted">対戦枠が空いています</span></div>
      <p class="muted" id="specHint" style="margin:0" hidden>観戦者として参加中です。対戦が始まると自動で観戦画面に切り替わります。</p>
      <h3 class="h3" id="rosterHead">あなたのキャラ</h3>
      <div class="roster" id="onRoster"></div>
    </div>
  </section>

  <section id="rogue" class="screen" hidden>
    <div class="subhead"><h2 id="rgTitle">ローグライト</h2><button class="link" id="rgBack" type="button">戻る</button></div>
    <div id="rgBody" class="screen"></div>
  </section>

  <section id="battle" class="screen" hidden>
    <div class="arena">
      <div class="fighter enemy" id="fe"></div>
      <div class="vs">VS</div>
      <div class="predBar" id="predBar" hidden></div>
      <div class="fighter player" id="fp"></div>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <p class="cmdHead" id="cmdHead"></p>
    <div class="cmds" id="cmds"></div>
    <button class="link" id="quit" type="button">モード選択に戻る</button>
  </section>
</main>

<div class="result" id="result" hidden>
  <div class="box">
    <h2 id="resTitle">勝利！</h2>
    <p id="resSub"></p>
    <div id="resBtns" style="display:flex;flex-direction:column;gap:10px"></div>
    <p class="rnote muted" id="resNote"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ================= キャラクター定義 ================= */
const CHARS = [
  { id:'kai', name:'カイ', role:'剣士', blurb:'攻守のバランス型。大技で一気に削る。',
    hp:140, mp:60, atk:32, def:20, spd:24,
    colors:{h:'#3a2a20',s:'#f0c8a0',a:'#3f7fbf',w:'#d8dde4',d:'#2a2f3a'},
    sprite:['....hhhh....','...hhhhhh...','...hssssh...','...sdssds..w','...ssssss..w','....ssss...w','..aaaaaaaa.w','.saaaaaaaasw','.s.aaaaaa..w','...aa..aa...','...aa..aa...','..ddd..ddd..'],
    skills:[
      {name:'斬撃', cost:0, kind:'attack', power:1.0, desc:'基本の一撃'},
      {name:'二連斬り', cost:15, kind:'attack', power:0.65, hits:2, desc:'2回攻撃'},
      {name:'構え', cost:0, kind:'guard', gain:10, desc:'先制で防御、MP+10'},
      {name:'疾風一閃', cost:40, kind:'attack', power:1.8, crit:0.25, desc:'威力大・会心率UP'}]},
  { id:'mira', name:'ミラ', role:'魔導士', blurb:'打たれ弱いが魔法と回復が強力。',
    hp:132, mp:100, atk:36, def:16, spd:25,
    colors:{h:'#5b3f8f',s:'#f3d2b3',a:'#7a56b8',w:'#c9a24a',d:'#2a2f3a'},
    sprite:['.....hh.....','....hhhh....','...hhhhhh...','..hhhhhhhh..','...sssss..w.','...sdsds..w.','...sssss..w.','..aaaaaaa.w.','.saaaaaaasw.','..aaaaaaa.w.','..aaaaaaa.w.','..aaaaaaa...'],
    skills:[
      {name:'杖打ち', cost:0, kind:'attack', power:0.7, desc:'弱い物理攻撃'},
      {name:'フレア', cost:20, kind:'attack', power:1.7, desc:'炎の魔法'},

/* ================= 戦闘エンジン（端末に依存しない純粋な計算） ================= */
// 状態は A / B の2陣営。結果は「演出ステップ」の列として返す: [文章, 効果, スナップショット]
// u：ローグライト用の能力定義。対戦用キャラ（CHAR）には含めず、戦闘状態の中に持たせる
const unitOf = f => f.u || CHAR[f.id];
function newF(id, u){
  const c = u || CHAR[id];
  const f = {id, hp:c.hp, mp:Math.floor(c.mp/2), defUp:0, evade:0, atkUp:0, poison:0, stun:0, guard:0, counter:0};
  if(u) f.u = u;
  return f;
}
function initState(a, b, ua, ub){ return {turn:1, A:newF(a, ua), B:newF(b, ub)}; }
const pack = f => [f.hp,f.mp,f.defUp,f.evade,f.atkUp,f.poison,f.stun,f.guard,f.counter];
const unpack = (id,a) => ({id, hp:a[0], mp:a[1], defUp:a[2], evade:a[3], atkUp:a[4], poison:a[5], stun:a[6], guard:a[7], counter:a[8]||0});

function calcDamage(a, t, sk){
  const atk = unitOf(a).atk * (a.atkUp>0 ? 1.3 : 1);
  const def = unitOf(t).def * (t.defUp>0 ? 1.6 : 1);
  let d = atk * sk.power * 50/(50+def);
  d *= 0.9 + Math.random()*0.2;
  const crit = Math.random() < (sk.crit ?? 0.05);
  if(crit) d *= 1.5;
  if(t.guard && !sk.sure) d *= 0.4;
  return {dmg:Math.max(1,Math.round(d)), crit};
}

function act(st, s, sk, push){
  const a=st[s], o=other(s), t=st[o];
  if(a.stun){ a.stun=0; push(`{${s}}はしびれて動けない！`); return; }
  if(sk.cost > a.mp){ push(`{${s}}は${sk.name}を使おうとしたが、MPが足りない！`); return; }
  a.mp -= sk.cost;
  if(sk.kind==='attack'){
    push(`{${s}}の${sk.name}！`, 'l'+s);
    if(t.counter){
      const cp = t.counter; t.counter = 0;
      push(`{${o}}は攻撃を見切った！`, 'm'+o);
      const r = calcDamage(t, a, {power:cp});
      a.hp -= r.dmg;
      push(`${r.crit?'会心の':''}反撃！ {${s}}に${r.dmg}のダメージ`, (r.crit?'c':'h')+s+r.dmg);
      return;
    }
    const hits = sk.hits||1;
    let dealt = 0;
    for(let i=0; i<hits && t.hp>0; i++){
      if(!sk.sure && t.evade>0 && Math.random()<0.5){ push(`{${o}}はひらりとかわした！`, 'm'+o); continue; }
      const {dmg,crit} = calcDamage(a,t,sk);
      t.hp -= dmg; dealt += dmg;
      push(`${crit?'会心の一撃！ ':''}{${o}}に${dmg}のダメージ${t.guard&&!sk.sure?'（構えで軽減）':''}`, (crit?'c':'h')+o+dmg);
    }
    if(sk.drain && dealt>0 && a.hp>0){
      const n = Math.min(unitOf(a).hp - a.hp, Math.round(dealt*sk.drain));
      if(n>0){ a.hp += n; push(`{${s}}は${n}吸収した！`, 'r'+s+n); }
    }
    if(sk.recoil && dealt>0){
      const n = Math.max(1, Math.round(dealt*sk.recoil));
      a.hp -= n; push(`{${s}}は反動で${n}のダメージ`, 'h'+s+n);
    }
    if(t.hp>0){
      if(sk.stun && Math.random()<sk.stun){ t.stun=1; push(`{${o}}はしびれた！`); }
      if(sk.poison){ t.poison=sk.poison; push(`{${o}}は毒におかされた！`); }
      if(sk.steal){ const n=Math.min(sk.steal,t.mp); t.mp-=n; a.mp=Math.min(unitOf(a).mp, a.mp+n); push(`{${o}}からMPを${n}奪った！`); }
    }
  } else {
    push(`{${s}}の${sk.name}！`);
    if(sk.kind==='heal'){
      const n = Math.min(unitOf(a).hp - a.hp, Math.round(unitOf(a).hp*sk.heal));
      a.hp += n; push(`{${s}}のHPが${n}回復した！`, 'r'+s+n);
    } else if(sk.kind==='buff'){
      a[sk.buff] = sk.turns; push(`{${s}}の${BUFF_LABEL[sk.buff]}！（${sk.turns}ターン）`);
    } else if(sk.kind==='guard'){
      a.guard = 1; a.mp = Math.min(unitOf(a).mp, a.mp + (sk.gain||0));
      push(`{${s}}は身構えた！ MP+${sk.gain||0}`);
    } else if(sk.kind==='counter'){
      a.counter = sk.counter; push(`{${s}}は静かに刀に手をかけた…`);
    }
  }
}

function resolveTurn(st0, picks){
  const st = clone(st0), steps = [];
  const push = (text,fx) => steps.push([text, fx||'', [pack(st.A), pack(st.B)]]);
  const sk = s => unitOf(st[s]).skills[picks[s]];
  const order = ['A','B'].sort((x,y)=>{
    const pri = k => k==='guard' || k==='counter';
    const gx = pri(sk(x).kind), gy = pri(sk(y).kind);
    if(gx!==gy) return gx ? -1 : 1;
    const sx = unitOf(st[x]).spd, sy = unitOf(st[y]).spd;
    if(sx!==sy) return sy - sx;
    return Math.random() - 0.5;
  });
  for(const s of order){
    if(st[s].hp<=0 || st[other(s)].hp<=0) break;
    act(st, s, sk(s), push);
  }
  for(const s of ['A','B']){
    const f = st[s], c = unitOf(f);
    f.guard = 0;
    if(f.counter){ f.counter = 0; if(f.hp>0) push(`{${s}}の見切りは空振りに終わった`); }
    if(f.hp<=0) continue;
    if(f.poison>0){
      const d = Math.max(1, Math.round(c.hp*0.06)); f.hp -= d; f.poison--;
      push(`{${s}}は毒で${d}のダメージ`, 'h'+s+d);
    }
    f.defUp=Math.max(0,f.defUp-1); f.evade=Math.max(0,f.evade-1); f.atkUp=Math.max(0,f.atkUp-1);
    if(f.hp>0) f.mp = Math.min(c.mp, f.mp+8);
  }
  let over = null;
  if(st.A.hp<=0 && st.B.hp<=0) over='draw';
  else if(st.A.hp<=0) over='B';
  else if(st.B.hp<=0) over='A';
  if(over==='draw') push('相打ち…！');
  else if(over) push(`{${other(over)}}は倒れた！`);
  else st.turn++;
  return {steps, state:st, over};
}

function cpuChoose(st, side){
  const me = st[side], foe = st[other(side)], c = unitOf(me);
  const usable = c.skills.map((s,i)=>({s,i})).filter(x=>x.s.cost<=me.mp);
  const rate = me.hp/c.hp;
  const heal = usable.find(x=>x.s.kind==='heal');
  if(heal && rate<0.45 && Math.random()<0.8) return heal.i;
  const guard = usable.find(x=>x.s.kind==='guard');
  if(guard && rate<0.35 && Math.random()<0.3) return guard.i;
  const ctr = usable.find(x=>x.s.kind==='counter');
  if(ctr && Math.random()<0.25) return ctr.i;
  const buff = usable.find(x=>x.s.kind==='buff' && !(me[x.s.buff]>0));
  if(buff && Math.random()<0.3) return buff.i;
  const atks = usable.filter(x=>x.s.kind==='attack');
  const dr = atks.find(x=>x.s.drain);
  if(dr && rate<0.5 && Math.random()<0.6) return dr.i;
  const big = atks.filter(x=>!(x.s.recoil && rate<0.3)).sort((a,b)=>b.s.cost-a.s.cost)[0];
  if(big && big.s.cost>=25 && Math.random()<0.65) return big.i;
  if(foe.poison===0){ const p = atks.find(x=>x.s.poison); if(p && Math.random()<0.5) return p.i; }
  return atks[Math.floor(Math.random()*atks.length)].i;
}

function whoLabel(side){

const fmt = t => t.replace(/\{([AB])\}/g, (_,s)=>dispName(s));

function renderBars(){
  for(const side of ['A','B']){

    r.querySelector('.fill.mp').style.width = (f.mp/c.mp*100)+'%';
    r.querySelector('.hpn').textContent = `${hp}/${c.hp}`;
    r.querySelector('.mpn').textContent = `${f.mp}/${c.mp}`;
    const chips = [];
    if(f.poison>0) chips.push(`<span class="chip poison">毒 ${f.poison}</span>`);
    if(f.stun) chips.push(`<span class="chip stun">しびれ</span>`);
    ['defUp','evade','atkUp'].forEach(k=>{ if(f[k]>0) chips.push(`<span class="chip">${BUFF_LABEL[k]} ${f[k]}</span>`); });
    if(f.guard) chips.push(`<span class="chip">構え中</span>`);
    if(f.counter) chips.push(`<span class="chip">見切り中</span>`);
    r.querySelector('.chips').innerHTML = chips.join('');

function renderCommands(){
  const cm = $('cmds'), head = $('cmdHead');
  cm.innerHTML=''; cm.classList.toggle('waiting', busy);
  if(!ST) return;
  if(mode==='online' && ON.role==='spec'){
    head.textContent = ''; cm.classList.remove('waiting');
    cm.append(specPanel());
    return;
  }
  let side = BOTTOM;
  if(mode==='local'){
    if(localStage==='handoff' && !busy){
      head.textContent = '';
      cm.append(waitPanel('1Pが技を選びました', '2Pに画面を渡してから、下のボタンを押してください', {label:'2Pが技を選ぶ', fn:()=>{ localStage='B'; renderCommands(); }}));
      return;
    }
    side = localStage==='B' ? 'B' : 'A';
  }
  if(mode==='online' && !busy && myPick && myPick.turn===ST.turn){
    head.textContent = '';
    const oppReady = onlineOppReady();
    cm.append(waitPanel(`<span class="dots">相手の選択を待っています</span>`,
      `あなたの技：${unitOf(ST[BOTTOM]).skills[myPick.idx].name}${oppReady?'｜相手は選択済み':''}`));
    return;
  }
  const f = ST[side], c = unitOf(f);

  });
}

async function playback(steps){
  for(const step of steps){
    const [text, fx, snap] = step;
    say(fmt(String(text)));
    if(Array.isArray(snap)){ VIEW = {turn:ST.turn, A:unpack(ST.A.id, snap[0]), B:unpack(ST.B.id, snap[1])}; }
    let wait = 650;
    if(fx){
      const k = fx[0], sd = fx[1], n = fx.slice(2);
      if(k==='l'){ anim(sd, sd===BOTTOM ? 'lunge-r' : 'lunge-l'); wait = 450; }
      else if(k==='h' || k==='c'){ anim(sd,'shake'); popup(sd, n, k==='c'?'crit':''); }
      else if(k==='m'){ popup(sd,'MISS','miss'); }
      else if(k==='r'){ popup(sd,'+'+n,'heal'); }
    }
    renderBars();
    await sleep(wait);
  }
}

function promptNext(){
  if(mode==='local') say(`${localStage==='B'?'2P':'1P'}の番です`);
  else if(mode==='online' && ON.role==='spec') say(`TURN ${ST.turn}：両者が技を選んでいます`);
  else say(`${dispName(BOTTOM)}はどうする？`);
}

function queueResult(r){
  busy = true; renderCommands();
  playChain = playChain.then(async ()=>{
    await playback(r.steps);
    ST = r.state; VIEW = clone(ST); myPick = null;
    renderBars();
    if(r.over){ matchOver = r.over; busy = true; renderCommands(); await sleep(600); showResult(r.over); }
    else { busy = false; promptNext(); renderCommands(); }
  });
}

function onPickSkill(side, i){
  if(busy) return;
  const f = ST[side], sk = unitOf(f).skills[i];
  if(!sk || sk.cost > f.mp) return;
  if(mode==='rogue'){
    rgTurn(i);
  } else if(mode==='cpu'){
    queueResult(resolveTurn(ST, {A:i, B:cpuChoose(ST,'B')}));
  } else if(mode==='local'){
    if(side==='A'){ localPick = i; localStage = 'handoff'; renderCommands(); }
    else { const a = localPick; localStage = 'A'; localPick = null; queueResult(resolveTurn(ST, {A:a, B:i})); }
  } else if(mode==='online'){
    onlineSubmitPick(i);
    renderCommands();
  }
}

function showResult(over){
  if(mode==='rogue'){ rgBattleEnd(); return; }
  const sub = `${unitOf(ST.A).name} vs ${unitOf(ST.B).name}｜${ST.turn}ターンで決着`;
  if(mode==='local'){
    const t = over==='draw' ? '引き分け' : over==='A' ? '1Pの勝利！' : '2Pの勝利！';
    const pair = [ST.A.id, ST.B.id];
    setResult(t, '', sub, [
      {label:'同じキャラで再戦', primary:true, fn:()=>startOffline(...pair)},
      {label:'キャラを選び直す', fn:()=>openPick('local')}]);
    return;
  }
  const pi = (mode==='online') ? ON.predInfo : null;
  const predNote = (pi && pi.mid===ON.mid && (pi.a+pi.b)>0) ? `観戦者の予想：${dispName('A')} ${pi.a}票 / ${dispName('B')} ${pi.b}票` : '';
  if(mode==='online' && ON.role==='spec'){
    const winner = over==='draw' ? '引き分け' : `${whoLabel(over)} ${unitOf(ST[over]).name}の勝利！`;
    const hit = ON.myPred ? (ON.myPred===over ? '予想的中！' : '予想はずれ…') : '';
    setResult(hit || winner, hit==='予想はずれ…' ? 'small lose' : 'small', hit ? `${winner}｜${sub}` : sub, [
      {label:'観戦を続ける', primary:true, fn:()=>{ $('result').hidden = true; renderCommands(); }},
      {label:'ルームを出る', fn:()=>leaveOnline()}],

    return;
  }
  const me = BOTTOM;
  const t = over==='draw' ? '引き分け' : over===me ? '勝利！' : '敗北…';
  const cls = over===me ? '' : 'lose';
  if(mode==='cpu'){

    setResult(t, cls, sub, [
      {label:'同じ組み合わせで再戦', primary:true, fn:()=>startOffline(...pair)},
      {label:'キャラを選び直す', fn:()=>openPick('cpu')}]);
  } else {
    if(ON.role==='host'){

        {label:'再戦する', primary:true, fn:hostRematch},
        {label:'ルームを出る', fn:()=>leaveOnline()}], predNote);

    }
  }

function rgGrowth(run){
  const g = {...RG_GROWTH[run.charId]}, adj = RG_DIFF[run.diff].growthAdj?.[run.charId] || {};
  for(const k in adj) g[k] += adj[k];

// 撃破後の報酬の数値
// healChance：HPが減っているとき（救済ライン超）に「回復 vs 強化」の2択になる確率。それ以外は強化2つ
// 基準：報酬1回分 ≒ レベルアップ約2回分（回復系はHPの割合なので別扱い）
const RG_REWARD = {hp:40, stat:8, spd:6, mp:20, pow:0.4, cost:8, heal:0.45, heal2:0.3, healChance:0.55};
const rgReward = run => ({...RG_REWARD, ...RG_DIFF[run.diff].reward});
const RG_RESCUE = 0.3;   // HPがこの割合以下なら、報酬の片方を必ず回復系にする
const pickOne = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---- 強くてニューゲーム：戦魂と永続強化（冒険をまたいで持ち越す） ---- */
// 戦魂：1階突破ごとに floor、ボス撃破で boss を足し、難易度の倍率（RG_DIFFS の soulMul）を掛ける。負けても到達分は入る
const RG_SOUL = {floor:3, boss:10};
// 永続強化。prices の数が段階数（上限）。効き目は報酬（RG_REWARD）との比率で決まるので、報酬を変えたらここも見直す
const RG_UPGRADES = [
  {id:'hp', name:'初期HP+15', prices:[20,40,60], hp:15, desc:'冒険の開始時の最大HPが上がる'},
  {id:'mp', name:'初期MP+10', prices:[30,60], mp:10, desc:'冒険の開始時の最大MPが上がる'},
  {id:'reroll', name:'報酬の引き直し', prices:[80], desc:'1回の冒険で1度だけ、報酬を選び直せる'},
  {id:'three', name:'報酬3択', prices:[150], desc:'撃破後の報酬が3つから選べる'}
];
const RG_UPGRADE = Object.fromEntries(RG_UPGRADES.map(u=>[u.id,u]));
// 冒険モードで使えるようになる条件（対戦モードでは最初から全員使える）。diff を chars 人の別キャラで踏破
const RG_CHAR_UNLOCK = {
  shizuku:{diff:'easy', chars:2, text:'「やさしい」を2人の別キャラで踏破すると解放'},
  doran:  {diff:'normal', chars:1, text:'「ふつう」を踏破すると解放'}
};
// 持ち越しデータ（進行中の冒険とは別に保存）。cleared：難易度ごとの踏破したキャラ
function rgNewMeta(){
  return {v:1, souls:0, ups:Object.fromEntries(RG_UPGRADES.map(u=>[u.id,0])), cleared:Object.fromEntries(RG_DIFFS.map(d=>[d.id,[]]))};
}
const rgCharOpen = (meta, id) => { const u = RG_CHAR_UNLOCK[id]; return !u || meta.cleared[u.diff].length >= u.chars; };
// 次の段階の値段。上限まで買っていたら null
const rgUpPrice = (meta, id) => RG_UPGRADE[id].prices[meta.ups[id]] ?? null;
function rgBuy(meta, id){
  const p = rgUpPrice(meta, id);
  if(p==null || meta.souls < p) return false;
  meta.souls -= p; meta.ups[id]++;
  return true;
}
function rgSoulsFor(run, cleared){
  const d = RG_DIFF[run.diff];
  return Math.floor(((cleared ? d.floors.length : run.floor)*RG_SOUL.floor + (cleared ? RG_SOUL.boss : 0)) * d.soulMul);
}
// 冒険の結果を持ち越しデータへ反映する。戻り値：獲得した戦魂と、新しく冒険で使えるようになったキャラ
function rgSettleMeta(meta, run, cleared){
  const souls = rgSoulsFor(run, cleared), before = CHARS.filter(c=>rgCharOpen(meta, c.id));
  meta.souls += souls;
  const list = meta.cleared[run.diff];
  if(cleared && !list.includes(run.charId)) list.push(run.charId);
  return {souls, chars:CHARS.filter(c=>!before.includes(c) && rgCharOpen(meta, c.id)).map(c=>c.id)};
}

// meta：持ち越しデータ。永続強化はランの開始時に冒険データへ書き込む（途中で買っても進行中の冒険は変わらない）
function rgNewRunState(diffId, charId, meta){
  const ch = clone(CHAR[charId]); delete ch.id;
  const ups = meta?.ups || {};
  ch.hp += (ups.hp||0)*RG_UPGRADE.hp.hp; ch.mp += (ups.mp||0)*RG_UPGRADE.mp.mp;
  return {v:2, diff:diffId, charId, ch, lv:1, exp:0, hp:ch.hp, floor:0, feathers:RG_DIFF[diffId].feathers,
    picks:[], stage:'map', battle:null, offer:null, wins:0, turns:0, choices:ups.three ? 3 : 2, rerolls:ups.reroll ? 1 : 0};
}

function rgEnemy(run){
  const d = RG_DIFF[run.diff], f = run.floor, node = d.floors[f];
  let e, mul, key;
  if(node==='boss'){ key = 'king'; e = clone(MONSTERS.king); mul = d.bossMul; }
  else if(node==='elite'){
    const base = CHARS.filter(c=>c.id!==run.charId);
    e = clone(pickOne(base)); key = e.id; delete e.id;
    e.name = `${e.name}の幻影`; e.exp = d.eliteExp; mul = d.eliteMul*(1+d.growth*f);
  } else {
    key = pickOne(d.pools[Math.min(f, d.pools.length-1)]); e = clone(MONSTERS[key]);
    mul = d.enemyMul*(1+d.growth*f);
  }
  e.hp = Math.round(e.hp*mul); e.atk = Math.round(e.atk*mul); e.def = Math.round(e.def*(1+mul)/2);
  const swap = d.foeSkills?.[key] || {};
  for(const i in swap) e.skills[i] = clone(swap[i]);
  if(node==='elite' && d.eliteUp){
    const s = e.skills.filter(s=>s.kind==='attack').sort((a,b)=>b.power*(b.hits||1)-a.power*(a.hits||1))[0];
    s.power = Math.round(s.power*(1+d.eliteUp)*100)/100; s.name += '+';
  }
  return e;
}

// 敵の技選び。難易度の ai の確率で考えて選び、それ以外はランダム
function rgFoeChoose(st, run){
  const d = RG_DIFF[run.diff];
  if(Math.random() < d.ai) return d.smart ? rgSmartChoose(st, 'B') : cpuChoose(st, 'B');
  return pickOne(st.B.u.skills.map((s,i)=>({s,i})).filter(x=>x.s.cost<=st.B.mp)).i;
}
// 賢い選び方：確実に倒せるならとどめを刺し、HPが減ったら必ず回復する。それ以外は cpuChoose
function rgSmartChoose(st, side){
  const me = st[side], foe = st[other(side)], c = unitOf(me), fc = unitOf(foe);
  const usable = c.skills.map((s,i)=>({s,i})).filter(x=>x.s.cost<=me.mp);
  const low = s => c.atk*(me.atkUp>0 ? 1.3 : 1)*s.power*(s.hits||1)*50/(50+fc.def*(foe.defUp>0 ? 1.6 : 1))*0.9;
  if(!(foe.evade>0)){
    const kill = usable.filter(x=>x.s.kind==='attack' && !(x.s.recoil && me.hp<=low(x.s)*x.s.recoil) && low(x.s)>=foe.hp).sort((a,b)=>a.s.cost-b.s.cost)[0];
    if(kill) return kill.i;
  }
  const heal = usable.find(x=>x.s.kind==='heal');
  if(heal && me.hp/c.hp<0.45) return heal.i;
  return cpuChoose(st, side);
}

// 戦闘開始時の状態。両陣営とも u（能力定義）を持ち、CHAR は参照されない
function rgBattleState(run){
  const st = initState('rg-you', 'rg-foe', clone(run.ch), rgEnemy(run));
  st.A.hp = run.hp;
  return st;
}

// 経験値を加え、上がったレベルの一覧を返す
function rgGainExp(run, n){
  run.exp += n;
  const ups = [];
  while(run.lv < RG_LV_EXP.length && run.exp >= RG_LV_EXP[run.lv]){
    run.lv++;
    const g = rgGrowth(run);
    for(const k in g) run.ch[k] += g[k];
    run.hp += g.hp;
    ups.push(run.lv);
  }
  return ups;
}

// 撃破後の報酬（2択、報酬3択を買っていれば3択）。heal:true が回復系
function rgOffers(run){
  const ch = run.ch, W = rgReward(run);
  const ups = [
    {t:'hp',  v:W.hp,   name:'体力強化', desc:`最大HP+${W.hp}（同じだけ回復）`},
    {t:'atk', v:W.stat, name:'攻撃強化', desc:`攻撃 ${ch.atk}→${ch.atk+W.stat}`},
    {t:'def', v:W.stat, name:'防御強化', desc:`防御 ${ch.def}→${ch.def+W.stat}`},
    {t:'spd', v:W.spd,  name:'速さ強化', desc:`速さ ${ch.spd}→${ch.spd+W.spd}`},
    {t:'mp',  v:W.mp,   name:'魔力強化', desc:`最大MP ${ch.mp}→${ch.mp+W.mp}`}
  ];
  const x = pickOne(ch.skills.map((s,i)=>({s,i})).filter(x=>x.s.kind==='attack'));
  ups.push({t:'pow', i:x.i, v:W.pow, name:`技強化：${x.s.name}`, desc:`威力+${Math.round(W.pow*100)}%`});
  const costly = ch.skills.map((s,i)=>({s,i})).filter(x=>x.s.cost>=10);
  if(costly.length){
    const y = pickOne(costly);
    ups.push({t:'cost', i:y.i, v:W.cost, name:`省力化：${y.s.name}`, desc:`消費MP ${y.s.cost}→${Math.max(0,y.s.cost-W.cost)}`});
  }
  const heals = [
    {t:'heal', v:W.heal, heal:true, name:'手当て', desc:`最大HPの${Math.round(W.heal*100)}%回復`},
    {t:'heal', v:W.heal2, heal:true, name:'薬草', desc:`最大HPの${Math.round(W.heal2*100)}%回復`}
  ];
  const hurt = run.hp < ch.hp;
  const n = run.choices || 2;
  if(hurt && (run.hp <= ch.hp*RG_RESCUE || Math.random() < W.healChance)) return shuffle([pickOne(heals), ...(n>2 ? shuffle(ups).slice(0,n-1) : [pickOne(ups)])]);
  return shuffle(ups).slice(0,n);
}
// 報酬の引き直し（1ランに rerolls 回）。rgOffers で作り直すので救済ルールもそのまま守られる
function rgReroll(run){
  if(!(run.rerolls > 0) || run.stage!=='reward') return false;
  run.rerolls--; run.offer = rgOffers(run);
  return true;
}

function rgApply(run, o){
  const ch = run.ch;
  switch(o.t){
    case 'hp': ch.hp += o.v; run.hp += o.v; break;
    case 'atk': case 'def': case 'spd': ch[o.t] += o.v; break;
    case 'mp': ch.mp += o.v; break;
    case 'heal':
      run.hp = Math.min(ch.hp, run.hp + Math.round(ch.hp*o.v)); break;
    case 'pow': { const s = ch.skills[o.i]; s.power = Math.round(s.power*(1+o.v)*100)/100; s.name += '+'; break; }
    case 'cost': { const s = ch.skills[o.i]; s.cost = Math.max(0, s.cost-o.v); break; }
  }
  if(!o.heal) run.picks.push(o.name);
}

// 1ターンの結果を冒険データへ反映する（演出の前に確定させ、保存する）
function rgCommitTurn(run, r){
  const st = r.state;
  if(!r.over){ run.battle.state = st; return {type:'cont'}; }
  if(r.over!=='A' && run.feathers>0){
    run.feathers--;
    const ns = clone(st);
    ns.A.hp = Math.ceil(run.ch.hp/2); ns.A.poison = 0; ns.A.stun = 0;
    if(r.over==='B'){ ns.turn++; run.battle.state = ns; return {type:'revive', state:ns}; }
    return rgCommitWin(run, ns, true);   // 相打ち：敵は倒れているので羽で立ち上がって勝利
  }
  if(r.over==='A') return rgCommitWin(run, st, false);
  run.turns += st.turn; run.battle = null; run.stage = 'lost';
  return {type:'lose', foe:st.B.u.name};
}
function rgCommitWin(run, st, revived){
  const d = RG_DIFF[run.diff], boss = d.floors[run.floor]==='boss';
  run.wins++; run.turns += st.turn;
  run.hp = Math.max(1, st.A.hp);
  const gain = st.B.u.exp || 0, ups = rgGainExp(run, gain);
  run.battle = null;
  if(boss){ run.stage = 'cleared'; return {type:'clear', foe:st.B.u.name, revived}; }
  run.stage = 'reward'; run.offer = rgOffers(run);
  return {type:'win', foe:st.B.u.name, gain, ups, turn:st.turn, revived};
}
function rgAfterReward(run, i){ rgApply(run, run.offer[i]); run.offer = null; run.floor++; run.stage = 'map'; }

/* ================= ローグライト：画面 ================= */
let R = null;              // 進行中の冒険（保存データと同じ形）
let RB = {node:'battle', outcome:null};
let rgBackFn = null;
const RG_SAVE = 'taiman-senki:rogue-run', RG_BEST = 'taiman-senki:rogue-best', RG_META = 'taiman-senki:rogue-meta';
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k, v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function rgLoad(){
  const r = lsGet(RG_SAVE);
  if(!r || r.v!==2 || !RG_DIFF[r.diff]?.ready || !isRosterId(r.charId) || !r.ch) return null;
  if(!['map','battle','reward'].includes(r.stage) || r.floor>=RG_DIFF[r.diff].floors.length) return null;
  if(r.stage==='battle' && !(r.battle?.state?.A?.u && r.battle.state.B?.u)) return null;
  if(r.stage==='reward' && !Array.isArray(r.offer)) return null;
  if(r.rerolls!=null && !Number.isInteger(r.rerolls)) return null;
  if(r.choices!=null && ![2,3].includes(r.choices)) return null;
  return r;
}
// 持ち越しデータ（戦魂・永続強化・キャラの解放）。形が違えば壊れているとみなし、初期状態から始める
function rgMeta(){
  const m = lsGet(RG_META), n = rgNewMeta();
  const count = (x, max) => Number.isInteger(x) && x>=0 && x<=max;
  if(!m || typeof m!=='object' || m.v!==n.v || !count(m.souls, 1e9) || !m.ups || typeof m.ups!=='object' || !m.cleared || typeof m.cleared!=='object') return n;
  if(!RG_UPGRADES.every(u=>count(m.ups[u.id], u.prices.length)) || !RG_DIFFS.every(d=>Array.isArray(m.cleared[d.id]))) return n;
  n.souls = m.souls;
  for(const u of RG_UPGRADES) n.ups[u.id] = m.ups[u.id];
  for(const d of RG_DIFFS) n.cleared[d.id] = [...new Set(m.cleared[d.id].filter(isRosterId))];
  return n;
}
// 冒険が終わったら保存を消す（再読み込みでやり直せないように、結果が決まった時点で即座に）
function rgSave(){ lsSet(RG_SAVE, ['map','battle','reward'].includes(R.stage) ? R : null); refreshRogueMode(); }
// 記録。壊れた値が入っていても止まらないよう、形を確かめてから使う
function rgBest(){
  const b = lsGet(RG_BEST), out = {};
  if(b && typeof b==='object') for(const d of RG_DIFFS){
    const r = b[d.id];
    if(r && Number.isFinite(r.clears) && Number.isFinite(r.bestFloor)) out[d.id] = {clears:r.clears, bestFloor:r.bestFloor};
  }
  return out;
}
function rgRecord(run, cleared){
  const best = rgBest();
  const rec = best[run.diff] || {clears:0, bestFloor:0};
  rec.bestFloor = Math.max(rec.bestFloor, cleared ? RG_DIFF[run.diff].floors.length : run.floor+1);
  if(cleared) rec.clears++;
  best[run.diff] = rec; lsSet(RG_BEST, best);
  return rec;
}
// 冒険の結果（負け・踏破）を記録と持ち越しデータへ反映する。結果が決まった時点で1回だけ呼ぶ
function rgSettle(run, cleared){
  const before = RG_DIFFS.filter(d=>rgUnlocked(d, rgBest()));
  const record = rgRecord(run, cleared);
  const meta = rgMeta(), got = rgSettleMeta(meta, run, cleared);
  lsSet(RG_META, meta);
  return {record, souls:got.souls, total:meta.souls, chars:got.chars, diffs:RG_DIFFS.filter(d=>!before.includes(d) && rgUnlocked(d, rgBest()))};
}
function refreshRogueMode(){
  const r = rgLoad();
  $('rogueDesc').textContent = r ? `続きから遊べます（${CHAR[r.charId].name} Lv${r.lv}・${r.floor+1}F／${RG_DIFF[r.diff].name}）`
    : '塔を登り、倒して育つ。最上階のボスを倒せば踏破。';
}
const rgD = () => RG_DIFF[R.diff];
// やさしいを踏破するとふつう、ふつうを踏破するとむずかしいが選べる
const rgUnlocked = (d, best) => d.ready && (!d.unlock || (best[d.unlock]?.clears || 0) > 0);

function rgView(title, back){
  $('rgTitle').textContent = title;
  rgBackFn = back; $('rgBack').hidden = !back;
  $('result').hidden = true;
  const b = $('rgBody'); b.innerHTML = '';
  mode = 'rogue'; ST = null; showScreen('rogue'); window.scrollTo(0,0);
  return b;
}
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; }
function choiceBtn(id, title, desc, fn, extra){
  const b = el('button', 'mode'); b.type = 'button'; b.id = id;
  b.append(el('span','mt',title), el('span','md',desc));
  if(extra) b.append(el('span','rec',extra));
  if(fn) b.addEventListener('click', fn); else b.disabled = true;

}
const goHome = () => { mode = null; ST = null; showScreen('home'); };

    const p = el('div','panel');
    const where = saved.stage==='battle' ? '戦闘中' : saved.stage==='reward' ? '報酬選択中' : '';

    const row = el('div','onRow');
    const c = el('button','btn primary','続きから'); c.type='button'; c.id='rgContinue';

    x.addEventListener('click', ()=>askConfirm('冒険を破棄しますか？', '進行中の冒険は記録に残らず消えます。', '破棄する', ()=>{ lsSet(RG_SAVE,null); refreshRogueMode(); rgShowDiffs(); }));
    row.append(c, x); p.append(row); b.append(p);
  }
  b.append(el('h3','h3','難易度'));
  const g = el('div','modes three');
  const best = rgBest();
  RG_DIFFS.forEach(d=>{
    const rec = best[d.id], open = rgUnlocked(d, best);
    const recText = !open ? `「${RG_DIFF[d.unlock].name}」を踏破すると解放` : rec ? `踏破 ${rec.clears}回・最高到達 ${rec.bestFloor}F` : '';
    g.append(choiceBtn('rgDiff-'+d.id, d.name, open ? d.desc : '？？？', open ? ()=>{
      if(saved) askConfirm('新しく始めますか？', '進行中の冒険は破棄されます。', '新しく始める', ()=>rgShowPick(d.id));
      else rgShowPick(d.id);
    } : null, recText));
  });
  b.append(g);
  const ul = el('ul','rules');
  ['HPは自然には回復しない',`HPが最大の${Math.round(RG_RESCUE*100)}%以下なら報酬に必ず回復が入る`,'戦闘中にやめても、その続きから再開','階を突破するたびに戦魂が手に入る（負けても到達分）'].forEach(t=>ul.append(el('li','',t)));
  b.append(ul, rgShopPanel());
}

// 強くてニューゲーム：戦魂で永続強化を買う
function rgShopPanel(){
  const meta = rgMeta(), p = el('div','panel shop');
  const head = el('div','subhead');
  head.append(el('h3','h3','強くてニューゲーム'), el('span','souls',`戦魂 ${meta.souls}`));
  p.append(head, el('p','muted',`戦魂は1階突破ごとに${RG_SOUL.floor}、ボス撃破で+${RG_SOUL.boss}（${RG_DIFFS.filter(d=>d.soulMul!==1).map(d=>`${d.name}×${d.soulMul}`).join('、')}）。強化は次に始める冒険から効きます。`));
  const g = el('div','modes');
  RG_UPGRADES.forEach(u=>{
    const lv = meta.ups[u.id], max = u.prices.length, price = rgUpPrice(meta, u.id);
    const extra = price==null ? '強化済み' : `戦魂 ${price}` + (meta.souls<price ? `（あと${price-meta.souls}）` : '');
    const buy = ()=>askConfirm(`${u.name}を強化しますか？`, `戦魂を${price}使います（所持 ${meta.souls}）。取り消しはできません。`, '強化する', ()=>{
      const m = rgMeta();
      if(rgBuy(m, u.id)) lsSet(RG_META, m);
      rgShowDiffs(); $('rgUp-'+u.id)?.focus();
    });
    g.append(choiceBtn('rgUp-'+u.id, u.name + (max>1 ? `（${lv}/${max}）` : ''), u.desc, price!=null && meta.souls>=price ? buy : null, extra));
  });
  p.append(g);
  return p;
}
function rgPerksText(meta){
  const u = meta.ups, t = [];
  if(u.hp) t.push(`初期HP+${u.hp*RG_UPGRADE.hp.hp}`);
  if(u.mp) t.push(`初期MP+${u.mp*RG_UPGRADE.mp.mp}`);
  if(u.reroll) t.push('報酬の引き直し');
  if(u.three) t.push('報酬3択');
  return t.join('・');
}

function rgShowPick(diffId){
  const b = rgView('使うキャラを選んでください', rgShowDiffs);
  const meta = rgMeta(), perks = rgPerksText(meta);
  b.append(el('p','muted',`難易度：${RG_DIFF[diffId].name}` + (perks ? `｜永続強化：${perks}` : '')));
  const ro = el('div','roster'); ro.id = 'rgRoster'; b.append(ro);
  buildRoster(ro, id=>{ R = rgNewRunState(diffId, id, meta); rgShowMap(); }, id=>rgCharOpen(meta, id) ? null : RG_CHAR_UNLOCK[id].text);
}

function rgResume(){
  if(R.stage==='reward') rgShowReward();
  else if(R.stage==='battle') rgBeginBattle(true);
  else rgShowMap();
}

function rgStatusPanel(){
  const ch = R.ch, p = el('div','panel rgStatus');
  const cv = el('canvas'); cv.width = 12; cv.height = 12; drawSprite(cv, ch, false);
  const info = el('div','info');
  info.innerHTML = `<div class="nameRow"><span class="name"></span><span class="tag"></span></div>
    <div class="bar"><span class="lbl">HP</span><div class="track"><div class="fill hp"></div></div><span class="num hpn"></span></div>
    <div class="bar"><span class="lbl">EXP</span><div class="track"><div class="fill xp"></div></div><span class="num xpn"></span></div>
    <div class="rgStats"></div><div class="chips"></div>`;
  info.querySelector('.name').textContent = `${ch.name} Lv${R.lv}`;

function rgShowMap(){
  R.stage = 'map'; rgSave();
  const fl = rgD().floors;
  const b = rgView(`${R.floor+1}F／${fl.length}F`, goHome);
  b.append(rgStatusPanel());

  fl.forEach((t, f)=>{
    const cur = f===R.floor;
    const row = el('div', 'floor'+(cur?' cur':''));

    row.append(n); list.append(row);
  });
  b.append(list);

function rgBeginBattle(resume){
  if(!resume){ R.battle = {state:rgBattleState(R)}; R.stage = 'battle'; rgSave(); }
  RB = {node:rgD().floors[R.floor], outcome:null};
  playChain = Promise.resolve();
  mode = 'rogue';
  beginMatch(clone(R.battle.state), 'A');
  const e = R.battle.state.B.u;
  if(resume) say(`${e.name}との戦いの続きから`);
  else say(RB.node==='boss' ? `塔の主、${e.name}が立ちはだかる！` : RB.node==='elite' ? `${e.name}（${e.role}）が現れた！` : `${e.name}が現れた！`);
  promptNext();
}

// 技を選んだ瞬間に結果を確定・保存し、そのあと演出を流す
function rgTurn(i){
  const r = resolveTurn(ST, {A:i, B:rgFoeChoose(ST, R)});
  const out = rgCommitTurn(R, r);
  if(out.type==='lose' || out.type==='clear') RB.settle = rgSettle(R, out.type==='clear');
  RB.outcome = out;
  rgSave();
  queueResult(r);
}

function rgBattleEnd(){
  const o = RB.outcome;
  if(o.type==='revive'){
    setResult('復活の羽が舞った！', 'small', `HPが半分まで戻った（残りの羽 ${R.feathers}枚）`, [{label:'戦いを続ける', primary:true, fn:()=>{
      ST = clone(o.state); VIEW = clone(ST); matchOver = null; busy = false; $('result').hidden = true;
      renderBars(); say(`${dispName('A')}は立ち上がった！`); promptNext(); renderCommands();
    }}]);
  } else if(o.type==='win'){
    const lines = [o.revived ? '復活の羽で立ち上がり、勝利をもぎ取った！' : `${o.turn}ターンで${o.foe}を撃破`, `経験値+${o.gain}`];
    if(o.ups.length){
      const g = rgGrowth(R), n = o.ups.length, lbl = {hp:'最大HP', atk:'攻撃', def:'防御', spd:'速さ', mp:'MP'};
      lines.push(`レベルアップ！ Lv${R.lv}（${Object.keys(lbl).filter(k=>g[k]).map(k=>`${lbl[k]}+${g[k]*n}`).join(' ')}）`);
    }
    setResult('勝利！', '', lines.join('｜'), [{label:'報酬を選ぶ', primary:true, fn:rgShowReward}]);
  } else if(o.type==='clear'){
    setResult('踏破！', '', `${o.foe}を倒した！`, [{label:'結果を見る', primary:true, fn:()=>rgFinish(true)}]);
  } else {
    setResult('敗北…', 'lose', `${R.floor+1}Fで力尽きた｜${o.foe}に敗れた`, [{label:'結果を見る', primary:true, fn:()=>rgFinish(false)}]);
  }
}

function rgShowReward(){

function rgFinish(cleared){
  const run = R, s = RB.settle || rgSettle(run, cleared), rec = s.record; R = null; RB.settle = null;
  const b = rgView('冒険の記録', null);

  [['キャラ', `${CHAR[run.charId].name}（${CHAR[run.charId].role}）Lv${run.lv}`], ['難易度', RG_DIFF[run.diff].name],
   ['到達', `${cleared ? RG_DIFF[run.diff].floors.length : run.floor+1}F／${RG_DIFF[run.diff].floors.length}F`], ['勝利', `${run.wins}回・合計${run.turns}ターン`],
   ['強化', run.picks.length ? run.picks.join('、') : 'なし'], ['記録', `踏破 ${rec.clears}回・最高到達 ${rec.bestFloor}F`],
   ['戦魂', `+${s.souls}（所持 ${s.total}）`]]
    .forEach(([k,v])=>dl.append(el('dt','',k), el('dd','',v)));
  p.append(dl);
  s.diffs.forEach(d=>p.append(el('p','got',`難易度「${d.name}」が選べるようになった！`)));
  s.chars.forEach(id=>p.append(el('p','got',`${CHAR[id].name}（${CHAR[id].role}）が冒険で使えるようになった！`)));
  const row = el('div','onRow');

  home.addEventListener('click', goHome);

}

/* ================= オンライン（PeerJS：ブラウザどうしを直接つなぐ） ================= */
// ホストのブラウザが「ルーム」になる。参加者は「対戦相手（1人）」か「観戦者」を選ぶ。
// 戦闘の計算はホスト側で行い、結果（演出ステップ＋確定状態）を全員へ送る。
const PEER_PREFIX = 'taiman-senki-';
const MAX_CLIENTS = 12;
const ON = {};
function resetOnline(){
  Object.assign(ON, {peer:null, conn:null, role:null, code:null, mid:null, myChar:null, oppChar:null,
    oppPick:null, oppReadyTurn:null, played:new Set(), clients:new Map(), lastState:null, lastOver:null,
    preds:new Map(), predOpen:false, lobby:{hostChar:null, oppChar:null, oppPresent:false, specCount:0},
    predInfo:{a:0, b:0, open:false, mid:null}, picks:{turn:0, a:false, b:false}, specCount:0, myPred:null, welcome:null});
}
resetOnline();

const PEER_OK = typeof Peer !== 'undefined';
if(PEER_OK){
  $('mode-online').disabled = false;
  $('onlineDesc').textContent = 'ルームコードやURLを送って、離れた友達と対戦・観戦します。';
} else {
  $('onlineDesc').textContent = '通信ライブラリを読み込めませんでした。インターネット接続を確認してください。';
}

function randCode(){
  const cs = 'abcdefghjkmnpqrstuvwxyz23456789'; let s='';
  for(let i=0;i<5;i++) s += cs[Math.floor(Math.random()*cs.length)];
  return s;
}
function note(t){ $('onNote').textContent = t; }
const isHost = () => ON.role==='host';
const isSpec = () => ON.role==='spec';
function sendTo(conn, msg){ try{ if(conn && conn.open) conn.send(msg); }catch(e){} }
function playerClient(){ for(const c of ON.clients.values()) if(c.role==='player') return c; return null; }
function broadcast(msg){ for(const c of ON.clients.values()) sendTo(c.conn, msg); }
// ホスト→対戦相手 / 参加者→ホスト
function send(msg){ if(isHost()) sendTo(playerClient()?.conn, msg); else sendTo(ON.conn, msg); }
function specCountNow(){ let n=0; for(const c of ON.clients.values()) if(c.role==='spec') n++; return n; }
function inviteUrl(){ return location.origin + location.pathname + '?room=' + ON.code; }
function onlineOppReady(){ return ON.oppReadyTurn===ST?.turn; }

function lobbyInfo(){
  const p = playerClient();
  return {t:'lobby', hostChar:ON.myChar, oppChar:p?ON.oppChar:null, oppPresent:!!p, specCount:specCountNow()};
}
function predsMsg(){
  let a=0, b=0;
  for(const s of ON.preds.values()){ if(s==='A') a++; else if(s==='B') b++; }
  return {t:'preds', mid:ON.mid, a, b, open:ON.predOpen};
}
function picksMsg(){
  const turn = ST?.turn || 0;
  return {t:'picks', mid:ON.mid, turn, a:!!(myPick && myPick.turn===turn), b:!!(ON.oppPick && ON.oppPick.turn===turn)};
}
// ホストが持っている状況を全員へ配る
function hostSync(){
  const l = lobbyInfo(), pm = predsMsg();
  ON.lobby = l; ON.specCount = l.specCount; ON.predInfo = pm;
  broadcast(l); broadcast(pm);
  renderLobby(); renderPredBar();
}

function netErrorText(err){
  const t = err?.type;
  if(t==='peer-unavailable') return 'そのコードのルームが見つかりません。コードが正しいか、ホストがページを開いたままか確認してください。';
  if(t==='network' || t==='server-error' || t==='socket-error' || t==='socket-closed') return '通信サーバーに接続できませんでした。少し待ってからもう一度お試しください。';
  if(t==='browser-incompatible') return 'このブラウザはオンライン対戦に対応していません。Chrome や Safari の最新版でお試しください。';
  return '接続できませんでした。もう一度お試しください。';
}

/* ---------- ホスト側 ---------- */
function hostCreate(attempt=0){
  if(!PEER_OK) return;
  note('ルームを作っています…');
  const code = randCode();
  const peer = new Peer(PEER_PREFIX + code);
  peer.on('open', ()=>{
    resetOnline(); Object.assign(ON, {peer, role:'host', code});
    enterLobby();
  });
  peer.on('connection', conn=>{
    conn.on('open', ()=>{
      if(ON.peer!==peer) return;
      if(ON.clients.size >= MAX_CLIENTS){ sendTo(conn, {t:'full'}); setTimeout(()=>conn.close(), 500); return; }
      ON.clients.set(conn.peer, {conn, role:null});
      sendTo(conn, {t:'welcome', slotFree:!playerClient()});
      sendTo(conn, lobbyInfo());
    });
    conn.on('data', d=>hostOnData(conn, d));
    conn.on('close', ()=>hostOnClose(conn));
    conn.on('error', ()=>{});
  });
  peer.on('error', err=>{
    if(err?.type==='unavailable-id' && attempt<3){ peer.destroy(); hostCreate(attempt+1); return; }
    if(!ON.peer){ peer.destroy(); note(netErrorText(err)); }
  });
}

function hostOnData(conn, d){
  if(!d || typeof d!=='object') return;
  const c = ON.clients.get(conn.peer); if(!c) return;
  if(d.t==='role'){
    if(d.role==='player'){
      if(playerClient() && c.role!=='player'){ sendTo(conn, {t:'roleDenied'}); return; }
      c.role = 'player'; ON.oppChar = null; ON.preds.delete(conn.peer);
      sendTo(conn, {t:'roleOk', role:'player'});
      hostSync();
    } else if(d.role==='spec'){
      if(c.role==='player') return;
      c.role = 'spec';
      sendTo(conn, {t:'roleOk', role:'spec'});
      if(ON.mid && ON.lastState) sendTo(conn, {t:'specState', mid:ON.mid, state:ON.lastState, over:ON.lastOver});
      hostSync();
      sendTo(conn, picksMsg());
    }
  } else if(d.t==='char' && c.role==='player'){
    ON.oppChar = isRosterId(d.id) ? d.id : null;
    hostSync(); maybeHostStart();
  } else if(d.t==='pick' && c.role==='player'){
    if(d.mid!==ON.mid) return;
    ON.oppPick = {turn:Number(d.turn), idx:Number(d.idx)};
    ON.oppReadyTurn = ON.oppPick.turn;
    broadcast(picksMsg());
    hostTryResolve();
    if(!busy && !$('battle').hidden) renderCommands();
  } else if(d.t==='predict' && c.role==='spec'){
    if(!ON.predOpen || d.mid!==ON.mid || (d.side!=='A' && d.side!=='B')) return;
    ON.preds.set(conn.peer, d.side);
    hostSync();
  } else if(d.t==='leave'){
    conn.close();
  }
}

function hostOnClose(conn){
  if(!ON.peer) return;
  const c = ON.clients.get(conn.peer); if(!c) return;
  ON.clients.delete(conn.peer); ON.preds.delete(conn.peer);
  if(c.role==='player') opponentLeft();
  else hostSync();
}

function maybeHostStart(){
  if(!isHost() || ON.mid) return;
  if(playerClient() && ON.myChar && CHAR[ON.oppChar]) hostStart();
}
function hostStart(){
  mode = 'online';
  ON.mid = Math.random().toString(36).slice(2,10);
  ON.played = new Set([ON.mid+':0']); ON.oppPick = null; ON.oppReadyTurn = null;
  ON.preds = new Map(); ON.predOpen = true;
  playChain = Promise.resolve();
  const st = initState(ON.myChar, ON.oppChar);
  ON.lastState = st; ON.lastOver = null;
  const r = {mid:ON.mid, turn:0, steps:[['{B}が挑戦してきた！',''],['対戦開始！','']], state:st, over:null};
  broadcast({t:'result', r});
  beginMatch(st, 'A');
  hostSync();
  broadcast(picksMsg());
  queueResult(r);
}
function hostRematch(){
  if(!playerClient() || !CHAR[ON.oppChar]){ $('resNote').textContent = '対戦相手が見つかりません。'; return; }
  hostStart();
}
function hostTryResolve(){
  if(!isHost() || !ON.mid || !ST || !myPick || !ON.oppPick) return;
  const key = ON.mid+':'+ST.turn;
  if(ON.played.has(key)) return;
  if(myPick.mid!==ON.mid || myPick.turn!==ST.turn || ON.oppPick.turn!==ST.turn) return;
  let gi = ON.oppPick.idx;
  const sk = unitOf(ST.B).skills[gi];
  if(!Number.isInteger(gi) || !sk || sk.cost > ST.B.mp) gi = 0;
  ON.played.add(key);
  if(ST.turn>=1) ON.predOpen = false;   // 予想は1ターン目の決着で締め切り
  const res = resolveTurn(ST, {A:myPick.idx, B:gi});
  const r = {mid:ON.mid, turn:ST.turn, steps:res.steps, state:res.state, over:res.over};
  ON.lastState = res.state; ON.lastOver = res.over;
  ON.oppPick = null; ON.oppReadyTurn = null;
  broadcast({t:'result', r});
  broadcast({t:'picks', mid:ON.mid, turn:res.state.turn, a:false, b:false});
  hostSync();
  queueResult(r);
}

function opponentLeft(){
  const inMatch = !!ON.mid;
  ON.mid = null; ON.oppChar = null; ON.oppPick = null; ON.oppReadyTurn = null;
  ON.predOpen = false; ON.preds = new Map(); ON.lastState = null; ON.lastOver = null;
  if(inMatch) broadcast({t:'matchAborted'});
  hostSync();
  if(inMatch && (!$('battle').hidden || !$('result').hidden)){
    busy = true; renderCommands();
    setResult('相手が退出しました', 'small', '', [
      {label:'次の相手を待つ', primary:true, fn:backToLobby},
      {label:'ルームを閉じる', fn:()=>leaveOnline()}],
      specCountNow() ? '観戦中の人が対戦相手として参加することもできます' : '');
  } else renderLobby();
}
function backToLobby(){
  $('result').hidden = true; ST = null;
  enterLobby();
}

/* ---------- 参加者側（対戦相手・観戦者） ---------- */
function guestJoin(code){
  if(!PEER_OK) return;
  note('ルームに接続しています…');
  const peer = new Peer();
  peer.on('open', ()=>{
    resetOnline(); Object.assign(ON, {peer, role:'pending', code});
    const conn = peer.connect(PEER_PREFIX + code, {reliable:true});
    ON.conn = conn;
    conn.on('data', onData);
    conn.on('close', ()=>{ if(ON.conn===conn){ ON.conn = null; hostGone(); } });
    conn.on('error', ()=>{});
    setTimeout(()=>{ if(ON.peer===peer && !ON.welcome) note('接続に時間がかかっています。ネットワーク環境によってはつながらないことがあります。'); }, 12000);
  });
  peer.on('error', err=>{
    if(!ON.welcome){ note(netErrorText(err)); try{ peer.destroy(); }catch(e){} resetOnline(); }
  });
}

function onData(d){
  if(!d || typeof d!=='object') return;
  const inBattle = !$('battle').hidden;
  switch(d.t){
    case 'welcome':
      ON.welcome = {slotFree:!!d.slotFree}; showRolePicker(); break;
    case 'full':
      leaveOnline(true); note('このルームは満員です。'); break;
    case 'roleOk':
      ON.role = d.role==='player' ? 'player' : 'spec';
      if(ON.role==='player'){ ON.myPred = null; enterLobby(); } else enterSpecLobby();
      break;
    case 'roleDenied':
      ON.welcome = {slotFree:false}; showRolePicker();
      $('roleSlotNote').textContent = 'ひと足早く対戦枠が埋まりました。観戦で参加できます。';
      break;
    case 'lobby':
      ON.lobby = d; ON.specCount = Number(d.specCount)||0;
      if(ON.role==='player') ON.oppChar = d.hostChar;
      if(ON.role==='pending' && ON.welcome){ ON.welcome.slotFree = !d.oppPresent; showRolePicker(); }
      renderLobby(); renderPredBar();
      if(isSpec() && inBattle) renderCommands();
      break;
    case 'preds':
      ON.predInfo = d; renderPredBar();
      if(isSpec() && inBattle) renderCommands();
      break;
    case 'picks':
      ON.picks = d; if(isSpec() && inBattle) renderCommands(); break;
    case 'ready':
      if(ON.role==='player'){ ON.oppReadyTurn = Number(d.turn); if(!busy && inBattle) renderCommands(); }
      break;
    case 'specState':
      if(isSpec() && d.state && rosterState(d.state)) specJoinMidway(d);
      break;
    case 'result': {
      const r = d.r;
      if(!r || typeof r.mid!=='string' || !validResult(r)) return;
      if(ON.role!=='player' && !isSpec()) return;
      if(r.mid!==ON.mid){ if(r.turn===0) followerStart(r); }
      else followerApply(r);
      break;
    }
    case 'matchAborted':
      if(isSpec()) specAborted(); break;
    case 'leave':
      ON.conn?.close(); break;
  }
}

function validResult(r){
  return r.state && rosterState(r.state) && Array.isArray(r.steps) && Number.isInteger(r.turn);
}
// 対戦で使えるのは対戦用キャラ（CHARS）だけ。ローグライトの敵などが混ざった状態は受け付けない
const isRosterId = id => CHARS.some(c=>c.id===id);
function rosterState(st){ return isRosterId(st.A?.id) && isRosterId(st.B?.id) && !st.A.u && !st.B.u; }

function followerStart(r){
  mode = 'online';
  ON.mid = r.mid; ON.played = new Set([r.mid+':0']); ON.oppReadyTurn = null; ON.myPred = null;
  ON.picks = {mid:r.mid, turn:1, a:false, b:false};
  playChain = Promise.resolve();
  beginMatch(clone(r.state), isSpec() ? 'A' : 'B');
  queueResult(r);
}
function followerApply(r){
  const key = r.mid+':'+r.turn;
  if(ON.played.has(key) || r.turn===0) return;
  ON.played.add(key); ON.oppReadyTurn = null;
  queueResult(r);
}
function specJoinMidway(d){
  mode = 'online';
  ON.mid = d.mid; ON.played = new Set(); ON.myPred = null;
  playChain = Promise.resolve();
  beginMatch(clone(d.state), 'A');
  say('観戦を開始しました');
  if(d.over){ matchOver = d.over; busy = true; renderCommands(); showResult(d.over); }
  else promptNext();
}
function specAborted(){
  ON.mid = null; busy = true; renderCommands();
  setResult('対戦相手が退出しました', 'small', '', [
    {label:'ロビーで待つ', primary:true, fn:()=>{ $('result').hidden = true; ST = null; enterSpecLobby(); }},
    {label:'ルームを出る', fn:()=>leaveOnline()}],
    '対戦枠が空いたので、ロビーから対戦相手として参加することもできます');
}
function hostGone(){
  if(!ON.peer) return;
  if(!$('battle').hidden || !$('result').hidden){
    busy = true; renderCommands();
    setResult('接続が切れました', 'small', 'ホストがルームを閉じたか、通信が途切れました。', [{label:'モード選択に戻る', primary:true, fn:()=>leaveOnline()}]);
  } else { leaveOnline(true); note('ホストとの接続が切れました。'); }
}

function onlineSubmitPick(i){
  myPick = {mid:ON.mid, turn:ST.turn, idx:i};
  if(isHost()){ send({t:'ready', turn:ST.turn}); broadcast(picksMsg()); hostTryResolve(); }
  else send({t:'pick', mid:ON.mid, turn:ST.turn, idx:i});
}

/* ---------- 画面 ---------- */
function showOnlinePanel(which){
  $('onIdle').hidden = which!=='idle';
  $('onRole').hidden = which!=='role';
  $('onLobby').hidden = which!=='lobby';
}
function showRolePicker(){
  mode = 'online';
  showOnlinePanel('role');
  const free = !!ON.welcome?.slotFree;
  $('rolePlayer').disabled = !free;
  $('roleSlotNote').textContent = free ? '対戦相手は1人まで。観戦は何人でも参加できます。' : '対戦枠は埋まっています。観戦で参加できます。';
  note('');
  showScreen('online');
}
function enterLobby(){
  mode = 'online';
  showOnlinePanel('lobby');
  $('onCodeShow').textContent = ON.code;
  $('onLinkRow').hidden = !isHost();
  $('rosterHead').hidden = false; $('onRoster').hidden = false; $('specHint').hidden = true;
  buildRoster($('onRoster'), id=>{
    ON.myChar = id; markSelected($('onRoster'), id);
    if(isHost()){ hostSync(); maybeHostStart(); }
    else { send({t:'char', id}); renderLobby(); }
  });
  if(ON.myChar) markSelected($('onRoster'), ON.myChar);
  note(''); showScreen('online'); renderLobby();
}
function enterSpecLobby(){
  mode = 'online';
  showOnlinePanel('lobby');
  $('onCodeShow').textContent = ON.code;
  $('onLinkRow').hidden = true;
  $('rosterHead').hidden = true; $('onRoster').hidden = true; $('specHint').hidden = false;
  note(''); showScreen('online'); renderLobby();
}
function renderLobby(){
  const dl = $('onStatus');
  if(!ON.peer || $('onLobby').hidden) return;
  const nm = id => CHAR[id] ? `${CHAR[id].name}（${CHAR[id].role}）` : null;
  let items, both;
  if(isHost()){
    const p = playerClient();
    items = [['あなた', `ホスト・${nm(ON.myChar)||'キャラ未選択'}`], ['対戦相手', p ? (nm(ON.oppChar)||'参加済み・キャラ選択中') : '参加を待っています…']];
    both = ON.myChar && p && CHAR[ON.oppChar];
  } else if(ON.role==='player'){
    items = [['あなた', `対戦相手・${nm(ON.myChar)||'キャラ未選択'}`], ['ホスト', nm(ON.lobby.hostChar)||'キャラ選択中']];
    both = ON.myChar && CHAR[ON.lobby.hostChar];
  } else {
    items = [['1P（ホスト）', nm(ON.lobby.hostChar)||'キャラ選択中'],
             ['2P', ON.lobby.oppPresent ? (nm(ON.lobby.oppChar)||'参加済み・キャラ選択中') : '参加を待っています…'],
             ['あなた', '観戦者']];
    both = CHAR[ON.lobby.hostChar] && CHAR[ON.lobby.oppChar];
  }
  items.push(['観戦', `${ON.specCount}人`]);
  dl.innerHTML = items.map(()=>'<dt></dt><dd></dd>').join('') + (both ? '<div class="hint">まもなく対戦が始まります</div>' : '');
  dl.querySelectorAll('dt').forEach((e,i)=>e.textContent = items[i][0]);
  dl.querySelectorAll('dd').forEach((e,i)=>e.textContent = items[i][1]);
  $('specJoinRow').hidden = !(isSpec() && !ON.lobby.oppPresent);
}
function predText(){
  const pi = ON.predInfo;
  if(!ST || !pi || pi.mid!==ON.mid || (pi.a+pi.b)===0) return '';
  return `勝敗予想 ${dispName('A')} ${pi.a} : ${pi.b} ${dispName('B')}`;
}
function renderPredBar(){
  const el = $('predBar');
  if(mode!=='online' || !ON.mid || !ST){ el.hidden = true; return; }
  const n = ON.specCount, pt = predText(), open = ON.predInfo?.open && ON.predInfo?.mid===ON.mid;
  if(!n && !pt){ el.hidden = true; return; }
  el.textContent = [`観戦 ${n}人`, pt, open ? '予想受付中' : ''].filter(Boolean).join('｜');
  el.hidden = false;
}
function specPanel(){
  const d = document.createElement('div'); d.className = 'waitPanel';
  const nameOf = s => `${whoLabel(s)} ${unitOf(ST[s]).name}`;
  const pi = ON.predInfo || {};
  if(!matchOver && pi.open && pi.mid===ON.mid && !ON.myPred){
    d.innerHTML = '<p>どちらが勝つと思う？</p><small>1ターン目が終わるまで予想できます</small>';
    const row = document.createElement('div'); row.className = 'predRow';
    ['A','B'].forEach(s=>{
      const b = document.createElement('button'); b.type='button'; b.className='btn'; b.id='pred-'+s;
      b.textContent = nameOf(s);
      b.addEventListener('click', ()=>{ ON.myPred = s; send({t:'predict', mid:ON.mid, side:s}); renderCommands(); });
      row.append(b);
    });
    d.append(row);
    return d;
  }
  const pk = ON.picks || {};
  const turnOk = pk.mid===ON.mid && pk.turn===ST.turn;
  const st = s => (turnOk && pk[s==='A'?'a':'b']) ? '選択済み' : '考え中…';
  let main, sub;
  if(matchOver){ main = '決着しました'; sub = '次の対戦が始まると自動で切り替わります'; }
  else if(busy){ main = '行動中…'; sub = ''; }
  else { main = `観戦中｜TURN ${ST.turn}`; sub = `1P：${st('A')}　2P：${st('B')}`; }
  if(ON.myPred) sub = [sub, `あなたの予想：${nameOf(ON.myPred)}`].filter(Boolean).join('｜');
  d.innerHTML = '<p></p><small></small>';
  d.querySelector('p').textContent = main;
  d.querySelector('small').textContent = sub;
  return d;
}

function resetOnlineScreens(){ showOnlinePanel('idle'); }
function leaveOnline(stayOnOnlineScreen){
  if(isHost()) broadcast({t:'leave'}); else send({t:'leave'});
  const p = ON.peer, conns = [ON.conn, ...[...ON.clients.values()].map(c=>c.conn)];
  resetOnline();
  conns.forEach(c=>{ try{ c?.close(); }catch(e){} });
  setTimeout(()=>{ try{ p?.destroy(); }catch(e){} }, 300);
  $('result').hidden = true; ST = null;
  if(stayOnOnlineScreen){ resetOnlineScreens(); showScreen('online'); }
  else { mode = null; showScreen('home'); }
}
window.addEventListener('pagehide', ()=>{ if(isHost()) broadcast({t:'leave'}); else send({t:'leave'}); });

/* ================= イベント ================= */
$('mode-rogue').addEventListener('click', ()=>rgShowDiffs());
$('mode-cpu').addEventListener('click', ()=>openPick('cpu'));
$('mode-local').addEventListener('click', ()=>openPick('local'));
$('mode-online').addEventListener('click', ()=>{
  mode = 'online'; resetOnlineScreens(); note('');
  showScreen('online');
});
$('rgBack').addEventListener('click', ()=>rgBackFn && rgBackFn());
refreshRogueMode();
$('pickBack').addEventListener('click', ()=>{ mode=null; showScreen('home'); });
$('onBack').addEventListener('click', ()=>{ if(ON.peer) leaveOnline(); else { mode=null; showScreen('home'); } });
$('onCreate').addEventListener('click', ()=>hostCreate());
$('onJoinForm').addEventListener('submit', e=>{
  e.preventDefault();
  const code = $('onCode').value.trim().toLowerCase();
  if(!/^[a-z0-9]{4,8}$/.test(code)){ note('コードは英数字で入力してください（例：k7mq2）'); return; }
  guestJoin(code);
});
$('rolePlayer').addEventListener('click', ()=>send({t:'role', role:'player'}));
$('roleSpec').addEventListener('click', ()=>send({t:'role', role:'spec'}));
$('specJoin').addEventListener('click', ()=>send({t:'role', role:'player'}));
function copyText(text, btn, label){
  const done = ()=>{ btn.textContent='コピーしました'; setTimeout(()=>btn.textContent=label, 1500); };
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>window.prompt('コピーしてください', text));
  else window.prompt('コピーしてください', text);
}
$('onCopy').addEventListener('click', ()=>copyText(ON.code||'', $('onCopy'), 'コードをコピー'));
$('onCopyLink').addEventListener('click', ()=>copyText(inviteUrl(), $('onCopyLink'), '招待URLをコピー'));
$('quit').addEventListener('click', ()=>{
  if(mode==='online') leaveOnline();
  else { $('result').hidden = true; ST = null; mode = null; showScreen('home'); }
});

// 招待URL（?room=xxxxx）から開いた場合はコードを入れておく
(function(){
  const code = new URLSearchParams(location.search).get('room');
  if(code && /^[a-z0-9]{4,8}$/i.test(code) && PEER_OK){
    mode = 'online';
    $('onCode').value = code.toLowerCase();
    resetOnlineScreens(); showScreen('online');
    note('招待されたルームのコードが入っています。「参加」を押してください。');
  }
})();
